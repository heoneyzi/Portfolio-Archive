name: Remove Korean summary sections
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-korean-summaries.yml]
permissions:
  contents: write
jobs:
  update:
    if: github.repository == 'heoneyzi/Portfolio-Archive'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply the reviewed Markdown-only edits
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, subprocess
          import re
          LABEL=re.compile(r'한국어\s*요약|국문\s*요약|korean\s*summary',re.I)
          DETAILS=re.compile(r'<details\b[^>]*>.*?</details>',re.I|re.S)
          HEAD=re.compile(r'^(#{1,6})[ \t]+(.+?)[ \t]*$',re.M)
          def clean(text):
              def drop(m):
                  summary=re.search(r'<summary\b[^>]*>(.*?)</summary>',m.group(),re.I|re.S)
                  return '' if summary and LABEL.search(summary.group(1)) else m.group()
              new=DETAILS.sub(drop,text)
              headings=list(HEAD.finditer(new));remove=[]
              for i,h in enumerate(headings):
                  if not LABEL.search(h.group(2)):continue
                  end=next((x.start() for x in headings[i+1:] if len(x.group(1))<=len(h.group(1))),len(new))
                  remove.append((h.start(),end))
              for a,b in reversed(remove):new=new[:a]+new[b:]
              if new!=text:new=re.sub(r'\n{3,}','\n\n',new)
              return new

          expected={'originals/reinforcing_material/README.md': {'before': 'a86a38931091e2a2a1f1dc88217a9b896874da32c83e6c8d984d922d48ccfa43', 'after': 'eb750c0eeaabaec2856a182588e4274a7f449256869ef42042187aa0670d480f'}}
          assert subprocess.check_output(['git','remote','get-url','origin'],text=True).strip().removesuffix('.git').endswith('/heoneyzi/Portfolio-Archive')
          changed=[]
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not name or Path(name).suffix.lower()!='.md':continue
              p=Path(name);before=p.read_bytes();after=clean(before.decode()).encode()
              if after==before:continue
              assert name in expected, f'Unreviewed change: {name}'
              assert hashlib.sha256(before).hexdigest()==expected[name]['before'], f'Source changed: {name}'
              assert hashlib.sha256(after).hexdigest()==expected[name]['after'], f'Unexpected result: {name}'
              p.write_bytes(after);changed.append(name)
          assert set(changed)==set(expected), 'Expected changes missing'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*changed],check=True)
          subprocess.run(['git','commit','-m','Remove Korean summary sections from Markdown documentation'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('Removed Korean summary sections from',len(changed),'Markdown files.')
          PYCODE
